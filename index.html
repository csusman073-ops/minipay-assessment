<!doctype html><html><head><meta charset="utf-8"><title>MiniPay</title><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/static/app.js" defer></script></head><body><main><h1>MiniPay Operations</h1><section id="loginPanel"><h2>Login</h2><p>Local direct login is enabled. No API key is required.</p><button id="loginBtn">Login</button><pre id="loginResult"></pre></section><section id="appPanel" hidden><p id="loginState">Authenticated</p><section><h2>Search transaction</h2><input id="searchRef" placeholder="TXN00000001"><span id="searchStatus" class="result-status"></span><button id="searchBtn">Search</button><pre id="searchResult"></pre></section><section><h2>Create test payment</h2><input id="customerId" type="number" placeholder="Customer ID" value="1"><input id="amount" type="number" step="0.01" placeholder="Amount" value="100.00"><input id="transactionRef" placeholder="Transaction ref"><span id="payStatus" class="result-status"></span><button id="payBtn">Submit payment</button><pre id="payResult"></pre></section></section></main></body></html>
